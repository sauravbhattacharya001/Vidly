name: Docker — Build & Push

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  schedule:
    # Weekly rebuild (Sunday 06:00 UTC) to pick up base-image security patches
    - cron: "0 6 * * 0"

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write    # Required for cosign keyless signing via Sigstore/Fulcio OIDC

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    name: Build & Push Docker Image
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Extract metadata
        id: meta
        shell: pwsh
        run: |
          $repo = "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}".ToLower()
          $tags = @()

          if ("${{ github.ref }}" -match "^refs/tags/v(.+)$") {
            $version = $Matches[1]
            $tags += "${repo}:${version}"
            # Add major.minor tag (e.g., 1.0)
            if ($version -match "^(\d+\.\d+)") {
              $tags += "${repo}:$($Matches[1])"
            }
            # Add major tag (e.g., 1)
            if ($version -match "^(\d+)") {
              $tags += "${repo}:$($Matches[1])"
            }
            $tags += "${repo}:latest"
          } elseif ("${{ github.ref }}" -eq "refs/heads/master" -or "${{ github.ref }}" -eq "refs/heads/main") {
            $sha = "${{ github.sha }}".Substring(0, 7)
            $tags += "${repo}:edge"
            $tags += "${repo}:sha-${sha}"
          } else {
            $sha = "${{ github.sha }}".Substring(0, 7)
            $tags += "${repo}:pr-${{ github.event.number }}"
            $tags += "${repo}:sha-${sha}"
          }

          $tagList = $tags -join ","
          echo "tags=$tagList" >> $env:GITHUB_OUTPUT
          echo "repo=$repo" >> $env:GITHUB_OUTPUT
          Write-Host "Tags: $tagList"

      - name: Build Docker image
        run: |
          $tags = "${{ steps.meta.outputs.tags }}".Split(",")
          $tagArgs = $tags | ForEach-Object { "-t", $_.Trim() }
          docker build @tagArgs .

      - name: Scan image with Trivy
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $repo = "${{ steps.meta.outputs.repo }}"
          $tag = if ("${{ github.ref }}" -match "^refs/tags/") { "latest" } else { "edge" }
          $image = "${repo}:${tag}"
          # Install Trivy on Windows
          # Get latest Trivy release version dynamically
          $latestRelease = (Invoke-RestMethod -Uri "https://api.github.com/repos/aquasecurity/trivy/releases/latest").tag_name -replace '^v',''
          $trivyUrl = "https://github.com/aquasecurity/trivy/releases/download/v${latestRelease}/trivy_${latestRelease}_windows-64bit.zip"
          Write-Host "Downloading Trivy v${latestRelease}..."
          Invoke-WebRequest -Uri $trivyUrl -OutFile trivy.zip
          Expand-Archive trivy.zip -DestinationPath trivy-bin
          ./trivy-bin/trivy.exe image --severity HIGH,CRITICAL --exit-code 0 --format table $image
          ./trivy-bin/trivy.exe image --severity HIGH,CRITICAL --format sarif --output trivy-results.sarif $image
        continue-on-error: true

      - name: Upload Trivy scan results
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

      - name: Report image size
        shell: pwsh
        run: |
          $repo = "${{ steps.meta.outputs.repo }}"
          $tag = if ("${{ github.ref }}" -match "^refs/tags/") { "latest" } else { "edge" }
          $image = "${repo}:${tag}"
          $size = docker image inspect $image --format='{{.Size}}'
          $sizeMB = [math]::Round([long]$size / 1MB, 1)
          Write-Host "Image size: ${sizeMB} MB"
          echo "| Image size | ${sizeMB} MB |" >> $env:GITHUB_STEP_SUMMARY

      - name: Verify container health
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $repo = "${{ steps.meta.outputs.repo }}"
          $tag = if ("${{ github.ref }}" -match "^refs/tags/") { "latest" } else { "edge" }
          $image = "${repo}:${tag}"

          Write-Host "Starting container from $image..."
          docker run -d --name vidly-test -p 8080:80 $image

          # Wait for IIS to initialize (Windows containers are slower to start)
          Start-Sleep -Seconds 30

          # Check container is running
          $status = docker inspect --format='{{.State.Status}}' vidly-test
          if ($status -ne "running") {
            Write-Host "::error::Container is not running. Status: $status"
            docker logs vidly-test
            exit 1
          }

          Write-Host "Container is running. Health check passed."
          docker stop vidly-test
          docker rm vidly-test

      - name: Push to GHCR
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $tags = "${{ steps.meta.outputs.tags }}".Split(",")
          foreach ($tag in $tags) {
            $t = $tag.Trim()
            Write-Host "Pushing $t..."
            docker push $t
          }

      - name: Generate SBOM
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $repo = "${{ steps.meta.outputs.repo }}"
          $tag = if ("${{ github.ref }}" -match "^refs/tags/") { "latest" } else { "edge" }
          $image = "${repo}:${tag}"
          # Install Syft for SBOM generation
          $syftRelease = (Invoke-RestMethod -Uri "https://api.github.com/repos/anchore/syft/releases/latest").tag_name -replace '^v',''
          $syftUrl = "https://github.com/anchore/syft/releases/download/v${syftRelease}/syft_${syftRelease}_windows_amd64.zip"
          Write-Host "Downloading Syft v${syftRelease}..."
          Invoke-WebRequest -Uri $syftUrl -OutFile syft.zip
          Expand-Archive syft.zip -DestinationPath syft-bin
          ./syft-bin/syft.exe $image -o spdx-json=sbom.spdx.json -o cyclonedx-json=sbom.cdx.json
          Write-Host "SBOM generated in SPDX and CycloneDX formats"
        continue-on-error: true

      - name: Upload SBOM artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: |
            sbom.spdx.json
            sbom.cdx.json
          retention-days: 90
        continue-on-error: true

      - name: Sign image with cosign
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          $repo = "${{ steps.meta.outputs.repo }}"
          # Install cosign
          $cosignRelease = (Invoke-RestMethod -Uri "https://api.github.com/repos/sigstore/cosign/releases/latest").tag_name -replace '^v',''
          $cosignUrl = "https://github.com/sigstore/cosign/releases/download/v${cosignRelease}/cosign-windows-amd64.exe"
          Write-Host "Downloading cosign v${cosignRelease}..."
          Invoke-WebRequest -Uri $cosignUrl -OutFile cosign.exe
          # Keyless signing via GitHub OIDC (requires id-token: write permission)
          $digest = docker inspect --format='{{index .RepoDigests 0}}' "${repo}:latest" 2>$null
          if ($digest) {
            Write-Host "Signing image digest: $digest"
            ./cosign.exe sign --yes $digest
            Write-Host "Image signed successfully"
          } else {
            Write-Host "::warning::Could not resolve image digest for signing"
          }
        continue-on-error: true

      - name: Attach SBOM to image
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $repo = "${{ steps.meta.outputs.repo }}"
          $digest = docker inspect --format='{{index .RepoDigests 0}}' "${repo}:latest" 2>$null
          if ($digest -and (Test-Path cosign.exe) -and (Test-Path sbom.spdx.json)) {
            ./cosign.exe attach sbom --sbom sbom.spdx.json $digest
            Write-Host "SBOM attached to image"
          }
        continue-on-error: true

      - name: Summary
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $tags = "${{ steps.meta.outputs.tags }}".Split(",") | ForEach-Object { "- ``$($_.Trim())``" }
          $summary = @"
          ## 🐳 Docker Image Published

          **Registry:** GitHub Container Registry (ghcr.io)

          **Tags:**
          $($tags -join "`n")

          **Pull command:**
          ``````
          docker pull $($tags[0].Replace("- ``", "").Replace("``", "").Trim())
          ``````

          **Supply Chain Security:**
          - 🔏 Image signed with cosign (keyless/Sigstore OIDC) on tagged releases
          - 📋 SBOM generated in SPDX and CycloneDX formats
          - 🔄 Weekly scheduled rebuild picks up base-image security patches

          > ⚠️ This is a **Windows container** image. Requires Docker Desktop with Windows containers enabled.
          "@
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
