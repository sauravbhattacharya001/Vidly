name: 📦 Dependency Issue
description: Report a NuGet package conflict, vulnerability, or upgrade problem
title: "[Deps]: "
labels: ["dependencies"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for NuGet package issues — version conflicts, security advisories, upgrade breakage, or missing dependencies.

  - type: dropdown
    id: issue-type
    attributes:
      label: Issue Type
      description: What kind of dependency problem is this?
      options:
        - Security vulnerability (CVE / advisory)
        - Version conflict / resolution failure
        - Breaking change after upgrade
        - Missing or outdated dependency
        - License compliance concern
        - NuGet restore failure
        - Dependabot PR needs attention
    validations:
      required: true

  - type: input
    id: package-name
    attributes:
      label: Package Name
      description: The affected NuGet package (or packages).
      placeholder: "Microsoft.AspNet.Mvc, EntityFramework"
    validations:
      required: true

  - type: input
    id: current-version
    attributes:
      label: Current Version
      description: The version currently used in the project.
      placeholder: "5.2.9"

  - type: input
    id: target-version
    attributes:
      label: Target / Problematic Version
      description: The version you're upgrading to, or the version with the issue.
      placeholder: "5.3.0"

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      description: How does this affect the project?
      options:
        - Build broken — cannot compile
        - Runtime failure — crashes or exceptions
        - Security risk — known vulnerability
        - Tests broken — regressions after upgrade
        - Cosmetic — warnings or deprecation notices
        - Informational — upgrade opportunity
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the dependency issue in detail.
      placeholder: |
        After updating EntityFramework from 6.4.x to 6.5.0, the DbContext
        initialization throws an InvalidOperationException during...
    validations:
      required: true

  - type: textarea
    id: error-output
    attributes:
      label: Error Output / Advisory Details
      description: Paste NuGet restore errors, CVE details, or stack traces.
      render: shell

  - type: textarea
    id: suggested-fix
    attributes:
      label: Suggested Fix
      description: If you have a proposed resolution, describe it here.

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: I have checked the package's changelog for known breaking changes
